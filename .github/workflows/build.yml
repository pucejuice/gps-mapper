name: Build Android APK

# Builds only when asked: "Run workflow" on the Actions tab, or pushing a
# version tag (e.g. git tag v2.2 && git push origin v2.2). Ordinary pushes don't build.
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayopps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
